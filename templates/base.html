<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coding Log</title>
<style>
    body { font-family: -apple-system, sans-serif; max-width: 800px; margin: auto; padding: 1rem; }
    table { width: 100%; border-collapse: collapse; }
    td, th { border-bottom: 1px solid #ddd; padding: .4rem; text-align: left; }
    label { display: block; margin-top: .6rem; }
    input, select, textarea { width: 100%; padding: .4rem; }
</style>
</head>
<body>
<nav><a href="{{ url_for('index') }}">All changes</a> | <a href="{{ url_for('add') }}">+ Add change</a></nav>

{% block content %}{% endblock %}
</body>
</html>
